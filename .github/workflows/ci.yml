name: Churn Model CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install pandas==2.0.3 numpy==1.24.4 scikit-learn==1.3.2 xgboost==2.0.3 pytest==7.4.0
      - name: Generate dataset
        run: python data/generate_data.py
      - name: Run tests
        run: pytest tests/ -v --tb=short

  validate:
    name: Validate Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: test -f data/generate_data.py && test -f model/train.py && test -f README.md && echo "All files present"
