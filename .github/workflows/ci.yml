name: Churn Model CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate dataset
        run: python data/generate_data.py

      - name: Run pytest
        run: pytest tests/ -v --tb=short --cov=data --cov-report=term-missing

      - name: Lint check
        run: |
          pip install flake8
          flake8 data/ model/ api/ tests/ --max-line-length=100 --ignore=E501

  train:
    name: Train & Validate Model
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: python data/generate_data.py
      - name: Train model
        run: python model/train.py
      - name: Validate model metrics
        run: |
          python -c "
          import json
          with open('model/artifacts/metrics.json') as f:
              m = json.load(f)
          print('Metrics:', m)
          assert m['accuracy'] > 0.75, f'Accuracy too low: {m[\"accuracy\"]}'
          assert m['auc_roc'] > 0.80, f'AUC-ROC too low: {m[\"auc_roc\"]}'
          print('✅ Model quality checks passed')
          "
